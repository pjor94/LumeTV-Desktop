[package]
name = "lume-cef-windows"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/pjor94/LumeTV-Desktop"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
dox = ["cef/dox"]

[dependencies]
anyhow = "1"
cef = { workspace = true }
lume-player = { path = "../.." }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
