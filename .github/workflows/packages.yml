name: Desktop packages

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: App / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      LUME_BUILD_PLATFORM: ${{ matrix.platform }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Cache the pinned SDK and native build dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cef-packaging/${{ matrix.platform }}
            target/desktop/${{ matrix.platform }}
            target/w
          key: desktop-${{ matrix.platform }}-v1-${{ hashFiles('Cargo.lock', 'vendor/download-cef/lume-sdk-pins.json', 'scripts/build_desktop.py', 'scripts/prepare_cef_sdk.py', 'scripts/bundle_cef.py') }}-${{ github.sha }}
          restore-keys: |
            desktop-${{ matrix.platform }}-v1-${{ hashFiles('Cargo.lock', 'vendor/download-cef/lume-sdk-pins.json', 'scripts/build_desktop.py', 'scripts/prepare_cef_sdk.py', 'scripts/bundle_cef.py') }}-
            desktop-${{ matrix.platform }}-v1-
      - name: Set up native build tools
        run: python -m pip install --disable-pip-version-check 'cmake>=3.31,<4' 'ninja>=1.12,<2'
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - name: Build and package macOS or Linux
        if: runner.os != 'Windows'
        run: python scripts/build_desktop.py --platform "$LUME_BUILD_PLATFORM"
      - name: Build and package Windows with the MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC installation not found' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python scripts/build_desktop.py --platform $env:LUME_BUILD_PLATFORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep downloadable packages, build metadata and SHA-256
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  source:
    name: Matching source and dependency sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Package the matching Git snapshot and Cargo sources
        run: python scripts/release_desktop.py source
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-source
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
